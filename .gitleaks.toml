# gitleaks settings for tools/release_gate.py. The default rules apply; pack output is not this
# repository's files (the gate scans the packed module separately).
[extend]
useDefault = true

[allowlist]
description = "Pack output and test results, not repository content"
paths = [
  '''(^|[\/])dist[\/]''',
  '''(^|[\/])TestResults[\/]''',
]
